name: Build & Release

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v (e.g. 1.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - name: 1.21.11
            branch: main
            java: 21
          - name: 26.1.2
            branch: 26.1
            java: 25
          - name: 26.2
            branch: 26
            java: 25
          - name: 26.3
            branch: 26.3
            java: 25

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.version.branch }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.version.java }}

      - uses: gradle/actions/setup-gradle@v3

      - run: chmod +x gradlew

      - name: Build for ${{ matrix.version.name }}
        run: ./gradlew build

      - name: Rename JARs with MC version
        run: |
          cd build/libs
          for jar in *.jar; do
            mv "$jar" "invistags-mc${{ matrix.version.name }}-${jar#invistags-}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: invistags-mc${{ matrix.version.name }}
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release tag
        id: tag
        run: echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: InvisTags ${{ inputs.version }}
          prerelease: false
          body: |
            **InvisTags ${{ inputs.version }} — stable release.**

            New in this release:
            - Armour and held-item reveal for invisible players (last-seen gear cache)
            - Vanished-player flag (entities missing from the tab list)
            - Two-player gametest: a real client observes the mineflayer bot while the server strips its gear

            Automated builds for MC versions:
            - 1.21.11
            - 26.1.2
            - 26.2
            - 26.3
          files: artifacts/**/*.jar
